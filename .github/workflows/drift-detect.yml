name: Drift Detection

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run drift detection
        id: drift
        run: npm run drift:detect
        continue-on-error: true
      - name: Create issue on drift
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠ Upstream drift detected in supply chain security data sources',
              body: `Drift detection found changes in upstream supply chain security data sources (SPDX, CycloneDX, SLSA, EU CRA, NIST SSDF, MITRE ATT&CK, OpenSSF).\n\nRun \`npm run drift:detect\` locally for details.\n\nTimestamp: ${new Date().toISOString()}`,
              labels: ['data-drift', 'automated']
            });
